# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The repo pins its SDK in global.json. Hardcoding a version here passed only as long as the
        # runner image happened to ship an SDK that global.json's rollForward would accept.
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore -warnaserror
    - name: Test
      run: dotnet test -c Release --no-build --filter 'Category!=Live' --logger trx --results-directory artifacts/test-results
    - name: Pack
      run: dotnet pack -c Release --no-build --output artifacts/packages
    - name: Upload verification artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sdk-verification
        path: |
          artifacts/test-results
          artifacts/packages
